  # -------------------------------------------------------------------------
  # 11. SK6812 RGB LED (NeoPixel-compatible)
  # -------------------------------------------------------------------------
  # Historical choice of SK6812 assumed 3.3V compatibility. The SK6812MINI-E
  # datasheet actually specifies 3.7V minimum, so the routed 3V3 supply is
  # outside its stated operating range; see stackup/README.md.
  # Pin and protocol compatible with WS2812B — driven via ESP32-S3's RMT
  # peripheral (pin 37), the standard driver mechanism for this timing.
  # R_RGB: 300-500Ω series on DIN for signal integrity (standard practice).
  # Decoupling: 100nF on VCC.
  RGB_LED:
    components:
      D_RGB:
        symbol: LED:SK6812
        sheet: RGB_LED
        value: SK6812MINI-E-012
        footprint: SnipsControllers_Custom:SK6812MINI-E-012
      R_RGB:
        symbol: Device:R
        sheet: RGB_LED
        value: 330Ω
        footprint: Resistor_SMD:R_0402_1005Metric
      C_RGB:
        symbol: Device:C
        sheet: RGB_LED
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
    connections:
      - net: 3V3
        pins: [D_RGB:VDD, C_RGB:1]
      - net: GND
        pins: [D_RGB:VSS, C_RGB:2]
      - net: RGB_DIN_R
        pins: [R_RGB:1]
      - net: RGB_DIN_R
        pins: [D_RGB:DIN]
      # DOUT: chains to the next LED in a strip — no next LED in this design
      - no_connect: [D_RGB:DOUT]

  # -------------------------------------------------------------------------
  # 12-13. Direct Buttons (vol up/dn, digital trigger, 6 macro buttons)
  # -------------------------------------------------------------------------
  # Active low, internal pull-ups in firmware. Wire to GND.
  # Macro buttons are direct-wired here too (no 2x3 scan matrix) — see the
  # MCU_Core note on why: ESP32-S3-WROOM-1 has enough spare GPIO that the
  # matrix's 1-pin savings isn't worth the anti-ghosting diodes and scan
  # firmware it used to require.
  Buttons_Direct:
    components:
      SW_VOL_UP:
        symbol: Switch:SW_Push
        sheet: Buttons_Direct
        value: Alps_SKRTLAE010
        footprint: Button_Switch_SMD:SW_Push_1P1T-MP_NO_Horizontal_Alps_SKRTLAE010
      SW_VOL_DN:
        symbol: Switch:SW_Push
        sheet: Buttons_Direct
        value: Alps_SKRTLAE010
        footprint: Button_Switch_SMD:SW_Push_1P1T-MP_NO_Horizontal_Alps_SKRTLAE010
      SW_THR_UP:
        symbol: Switch:SW_Push
        sheet: Buttons_Direct
        value: Alps_SKRTLAE010
        footprint: Button_Switch_SMD:SW_Push_1P1T-MP_NO_Horizontal_Alps_SKRTLAE010
      SW_THR_DN:
        symbol: Switch:SW_Push
        sheet: Buttons_Direct
        value: Alps_SKRTLAE010
        footprint: Button_Switch_SMD:SW_Push_1P1T-MP_NO_Horizontal_Alps_SKRTLAE010
      SW_TRIG_DIG:
        symbol: Switch:SW_Push
        sheet: Buttons_Direct
        value: Alps_SKRTLAE010
        footprint: Button_Switch_SMD:SW_Push_1P1T-MP_NO_Horizontal_Alps_SKRTLAE010
      SW_MACRO1:
        symbol: Switch:SW_Push
        sheet: Buttons_Direct
        value: 6x6x5mm SMD Tactile
        footprint: Button_Switch_SMD:SW_Push_1TS009xxxx-xxxx-xxxx_6x6x5mm
      SW_MACRO2:
        symbol: Switch:SW_Push
        sheet: Buttons_Direct
        value: 6x6x5mm SMD Tactile
        footprint: Button_Switch_SMD:SW_Push_1TS009xxxx-xxxx-xxxx_6x6x5mm
      SW_MACRO3:
        symbol: Switch:SW_Push
        sheet: Buttons_Direct
        value: 6x6x5mm SMD Tactile
        footprint: Button_Switch_SMD:SW_Push_1TS009xxxx-xxxx-xxxx_6x6x5mm
      SW_MACRO4:
        symbol: Switch:SW_Push
        sheet: Buttons_Direct
        value: 6x6x5mm SMD Tactile
        footprint: Button_Switch_SMD:SW_Push_1TS009xxxx-xxxx-xxxx_6x6x5mm
      SW_MACRO5:
        symbol: Switch:SW_Push
        sheet: Buttons_Direct
        value: 6x6x5mm SMD Tactile
        footprint: Button_Switch_SMD:SW_Push_1TS009xxxx-xxxx-xxxx_6x6x5mm
      SW_MACRO6:
        symbol: Switch:SW_Push
        sheet: Buttons_Direct
        value: 6x6x5mm SMD Tactile
        footprint: Button_Switch_SMD:SW_Push_1TS009xxxx-xxxx-xxxx_6x6x5mm
    connections:
      - net: GND
        pins: [SW_VOL_UP:2, SW_VOL_DN:2, SW_THR_UP:2, SW_THR_DN:2,
               SW_TRIG_DIG:2, SW_MACRO1:2, SW_MACRO2:2, SW_MACRO3:2,
               SW_MACRO4:2, SW_MACRO5:2, SW_MACRO6:2]

  # -------------------------------------------------------------------------
  # 14. ERC power flags
  # -------------------------------------------------------------------------
  # KiCad's ERC requires every net with a "power input" pin on it to also
  # have a "power output" pin (or a PWR_FLAG) somewhere on that same net,
  # to confirm the net is actually externally driven. None of our regulator
  # ICs expose a strictly "power_out"-typed pin on 3V3/GND (their outputs
  # come through inductors/resistors, which are "passive"-typed), so ERC
  # can't infer it on its own. Standard, expected step for any schematic —
  # not a design bug. PF_VSYS specifically is required even though VSYS
  # already has a real Output-type driver (U_CHG:SYS) elsewhere on the
  # net — Power_Buck's VIN pin is "Power input" type, which only accepts
  # a genuine "Power output" pin as a driver, and PWR_FLAG is the only
  # thing on this net with that exact type (confirmed empirically: removing
  # PF_VSYS broke Power_Buck's ERC). No explicit position overrides needed
  # — auto-layout places these fine now that routing is deterministic.
  Power_Flags:
    components:
      PF_3V3:
        symbol: power:PWR_FLAG
        sheet: MCU_Core
        value: PWR_FLAG
        footprint: ""
        power: true
        on_board: false
        in_bom: false
      PF_GND:
        symbol: power:PWR_FLAG
        sheet: MCU_Core
        value: PWR_FLAG
        footprint: ""
        power: true
        on_board: false
        in_bom: false
      PF_VSYS:
        symbol: power:PWR_FLAG
        sheet: MCU_Core
        value: PWR_FLAG
        footprint: ""
        power: true
        on_board: false
        in_bom: false
      PF_VBUS:
        symbol: power:PWR_FLAG
        sheet: MCU_Core
        value: PWR_FLAG
        footprint: ""
        power: true
        on_board: false
        in_bom: false
      PF_VBAT:
        symbol: power:PWR_FLAG
        sheet: MCU_Core
        value: PWR_FLAG
        footprint: ""
        power: true
        on_board: false
        in_bom: false
    connections:
      - net: 3V3
        pins: [PF_3V3:1]
      - net: GND
        pins: [PF_GND:1]

# ---------------------------------------------------------------------------
# DESIGN NOTES
# ---------------------------------------------------------------------------
# 1. bq25185 TS/MR pin: MUST tie to GND via 10kΩ (R_TS) if no thermistor.
#    Floating TS = charging suspended. Critical, easy to miss.
#
# 2. TLV62569 output voltage set by R_FB1/R_FB2 divider.
#    VOUT = 0.6V * (1 + R_FB1/R_FB2). Verify with 1% resistors.
#
# 3. USB-C CC resistors (R_CC1, R_CC2 = 5.1kΩ to GND) REQUIRED for
#    USB-C chargers to negotiate power. Omitting = no charging from USB-C.
#
# 4. I2C pull-ups: intentionally absent. Adafruit #938 breakout has onboard
#    pull-ups — adding local ones would halve the effective resistance and
#    cause I2C issues. Only relevant if a future revision drops the breakout
#    for a bare OLED panel, which this board doesn't plan to do.
#
# 5. XBee RESET RC filter: same as AmidalaShield V1.2.
#    10kΩ pull-up to 3V3, 100Ω series + 100nF to GND at RESET pin.
#
# 6. Battery voltage sense: pin 7 (ADC1_CH6) via R_VSYS1/R_VSYS2 divider
#    (reads VSYS/3). No firmware/WiFi ADC contention concern on ESP32-S3 —
#    unlike the old bit-banged RP2350+CYW43439 design, WiFi is fully
#    on-die here and doesn't share any exposed GPIO/ADC path.
#
# 7. ESP32-S3-WROOM-1 powered via its 3V3 pin (pin 2) directly — the module
#    has no separate VSYS-style pin, its own internal regulation is only
#    for the RF/digital core, not a board-level supply input.
#
# 8. EN (pin 3) and GPIO0/BOOT (pin 27) are strapping pins, each pulled up
#    externally via 10kΩ (R_EN_PU/R_BOOT_PU) per standard ESP32-S3
#    practice. GPIO0 additionally has SW_BOOT to pull it low at boot to
#    force UF2/download mode. GPIO3/45/46 are also strapping pins — left
#    unconnected (see RESERVED GPIO), fine to use later but avoid anything
#    that toggles during boot.
#
# 9. CE pin on bq25185 tied to GND (always enable charging).
#
# 10. Power control: PWR_HOLD (pin 36) must be driven HIGH as the very
#     first instruction in firmware or power cuts when user releases the
#     power button.
#
# 11. SK6812 DIN series resistor R_RGB placed close to the RGB_DIN
#     pad (pin 37). The LED is supplied at 3.3V, below its specified 3.7V
#     minimum; reduced brightness alone is not the full risk.
#
# 12. Macro buttons are direct-wired (no scan matrix, no anti-ghosting
#     diodes needed) — see MCU_Core section for why.
#
# 13. STAT2 on bq25185 wired to R_STAT2 (10kΩ pull-up to 3V3) and MCU pin 34
#     (GPIO41). STAT1 alone only tells firmware "charging vs not" — STAT1+
#     STAT2 together fully decode the charger's 4 states (charging, done,
#     recoverable fault, latched fault) per the datasheet's status table.
#
# 14. XBee footprint: Xbee3:XB324Z8UTJ (real THT footprint, same one
#     already validated on the Amidala board — sourced from the vendor's
#     multi-format library dump, not RF_Module:XBee_THT, which never
#     actually existed in stock KiCad libraries).
#     Update to SMT module footprint for final PCB if size requires it.
#
# 15. ESP32-S3-WROOM-1 antenna keepout: the module's footprint (Espressif's
#     official Espressif.pretty library) includes the required antenna
#     keepout area — keep copper/components out of it per the module's
#     datasheet. Much simpler than the old Murata design's custom PCB

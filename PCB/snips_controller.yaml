        footprint: Package_TO_SOT_THT:TO-92_Inline
      C_HALL:
        symbol: Device:C
        sheet: Hall_Trigger
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric
    connections:
      - net: 3V3
        pins: [U_HALL:VCC, C_HALL:1]
      - net: GND
        pins: [U_HALL:GND, C_HALL:2]

  # -------------------------------------------------------------------------
  # 10. GuliKit Hall Effect Thumbstick
  # -------------------------------------------------------------------------
  # OEM-replacement-style hall/TMR stick (ALPS RKJXV1224 / C&K THB001P
  # footprint family) -- a 2-axis potentiometer-emulation interface, not a
  # simple VCC/GND/X/Y/SW breakout. Each axis needs its own low/wiper/high
  # connection (1/2/3 for X, 1'/2'/3' for Y); switch is pins a/c (b/d are
  # mechanically-redundant duplicate legs, intentionally unconnected).
  # Decoupling: 100nF on VCC.
  Thumbstick:
    components:
      J_STICK:
        symbol: SnipsControllers_Custom:GuliKit_HallStick
        sheet: Thumbstick
        value: GuliKit_Thumbstick
        footprint: SnipsControllers_Custom:GuliKit_HallStick
      C_STICK:
        symbol: Device:C
        sheet: Thumbstick
        value: 100nF
        footprint: Capacitor_SMD:C_0402_1005Metric

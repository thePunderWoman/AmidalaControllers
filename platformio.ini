; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = kb2040

; Adafruit KB2040 (RP2040). The official "raspberrypi" platform in the
; PlatformIO registry only ships board defs for the Pico and Nano RP2040
; Connect, so we use the community platform that packages earlephilhower's
; arduino-pico core instead — it's the one with adafruit_kb2040 support.
[env:kb2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_kb2040
framework = arduino
monitor_speed = 115200

; Native (host) environment for unit tests — no hardware required.
; main.cpp pulls in Arduino.h, so it's excluded here; everything else in
; src/ is hardware-agnostic and gets linked into the test binary.
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<*> -<main.cpp>
test_framework = unity
build_flags = --coverage
extra_scripts = pre:scripts/native_coverage_linkflags.py

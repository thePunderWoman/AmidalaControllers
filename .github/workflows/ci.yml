name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, stackup]
  pull_request:
    branches: [main, stackup]

jobs:
  stackup-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Stackup KiCad plugin
        uses: actions/checkout@v4
        with:
          repository: stackup-eda/stackup
          ref: v0.1.3
          path: stackup-tool

      - name: Install Rust 1.96
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Check Stackup design
        run: cargo +1.96.0 run --locked --manifest-path ci/stackup/Cargo.toml -- check PCB/stackup/board.kdl --locked

      - name: Check purchasing BOM
        run: cargo +1.96.0 run --locked --manifest-path ci/stackup/Cargo.toml -- bom PCB/stackup/board.kdl --locked -o /tmp/snips-bom.csv

      - name: Install KiCad 10
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --install-recommends kicad

      - name: Check PCB sync
        run: |
          /usr/bin/python3 ci/check_pcb_sync.py PCB/snips_controller.kicad_pcb \
            --stackup ci/stackup/target/debug/snips-stackup-check \
            --plugin-dir stackup-tool/kicad-plugin

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-platformio-native-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio gcovr

      - name: Run native unit tests
        run: pio test -e native

      - name: Coverage report
        run: |
          output=$(gcovr --root . --filter 'src/' --exclude 'src/SnipsController\.ino' --exclude 'src/oled\.cpp' --exclude 'src/rgb_led\.cpp' --exclude 'src/calibration_store\.cpp' --exclude 'src/droid_persistence\.cpp' --exclude 'src/xbee_spi\.cpp' --exclude 'src/xbee_control\.cpp' --exclude 'src/complication_persistence\.cpp' --exclude 'src/accelerometer\.cpp' --exclude 'src/power_config_store\.cpp' --print-summary --fail-under-line 90)
          status=$?
          {
            echo '### Coverage (src/, excluding SnipsController.ino and hardware adapters)'
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$output"
          exit $status

  esp32s3-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-platformio-esp32s3-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build esp32s3 firmware
        run: pio run -e esp32s3
